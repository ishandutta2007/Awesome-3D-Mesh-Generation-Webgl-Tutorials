<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="cyanPurpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPinkViolet" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f857a6"/><stop offset="100%" stop-color="#ff5858"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="30%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#38bdf8"/><animate attributeName="x1" dur="12s" repeatCount="indefinite" values="0%;100%;0%"/><animate attributeName="x2" dur="12s" repeatCount="indefinite" values="100%;200%;100%"/></linearGradient><linearGradient id="wireframeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".7"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".4"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="slightGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,30px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-25px) scale(.9)}}@keyframes rotateMesh{0%{transform:rotate(0deg)}}@keyframes pulsePill{0%{opacity:.85;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}.orb-1{animation:floatOrb1 10s ease-in-out infinite}.orb-2{animation:floatOrb2 12s ease-in-out infinite}.mesh-spin{transform-origin:1040px 170px;animation:rotateMesh 35s linear infinite}.mesh-spin-left{transform-origin:140px 240px;animation:rotateMesh 45s linear infinite reverse}.pill-anim-1{animation:pulsePill 4s ease-in-out infinite}.pill-anim-2{animation:pulsePill 4s ease-in-out 1s infinite}.pill-anim-3{animation:pulsePill 4s ease-in-out 2s infinite}.pill-anim-4{animation:pulsePill 4s ease-in-out 3s infinite}.wire-dash{stroke-dasharray:6,6;animation:dashCycle 6s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="orb-1"><circle cx="220" cy="110" r="160" fill="#00f2fe" fill-opacity=".08" filter="url(#glow)"/><circle cx="980" cy="280" r="180" fill="#a855f7" fill-opacity=".09" filter="url(#glow)"/></g><g class="orb-2"><circle cx="600" cy="360" r="170" fill="#38bdf8" fill-opacity=".07" filter="url(#glow)"/><circle cx="1060" cy="90" r="130" fill="#ec4899" fill-opacity=".08" filter="url(#glow)"/></g><g class="mesh-spin-left" opacity=".32"><polygon fill="none" stroke="url(#wireframeGrad)" stroke-width="1.2" points="140 160 210 195 210 275 140 310 70 275 70 195" class="wire-dash"/><polygon fill="none" stroke="#38bdf8" stroke-width="1" points="140 180 190 210 190 265 140 290 90 265 90 210"/><line x1="140" x2="140" y1="160" y2="310" stroke="#818cf8" stroke-width="1"/><line x1="70" x2="210" y1="195" y2="275" stroke="#818cf8" stroke-width="1"/><line x1="70" x2="210" y1="275" y2="195" stroke="#818cf8" stroke-width="1"/><circle cx="140" cy="160" r="3.5" fill="#00f2fe"/><circle cx="210" cy="195" r="3.5" fill="#38bdf8"/><circle cx="210" cy="275" r="3.5" fill="#818cf8"/><circle cx="140" cy="310" r="3.5" fill="#c084fc"/><circle cx="70" cy="275" r="3.5" fill="#ec4899"/><circle cx="70" cy="195" r="3.5" fill="#00f2fe"/><circle cx="140" cy="235" r="4.5" fill="#fff" filter="url(#slightGlow)"/></g><g class="mesh-spin" opacity=".45"><ellipse cx="1040" cy="170" fill="none" stroke="url(#wireframeGrad)" stroke-width="1.4" class="wire-dash" rx="100" ry="40" transform="rotate(30 1040 170)"/><ellipse cx="1040" cy="170" fill="none" stroke="url(#wireframeGrad)" stroke-width="1.4" class="wire-dash" rx="100" ry="40" transform="rotate(-30 1040 170)"/><ellipse cx="1040" cy="170" fill="none" stroke="#38bdf8" stroke-dasharray="3 5" stroke-width=".8" rx="100" ry="100"/><polygon fill="none" stroke="#c084fc" stroke-width="1.2" points="1040 80 1120 140 1100 230 1040 260 970 220 960 130"/><line x1="1040" x2="1040" y1="80" y2="260" stroke="#f43f5e" stroke-width="1.2"/><line x1="960" x2="1120" y1="130" y2="140" stroke="#38bdf8" stroke-width="1.2"/><line x1="970" x2="1100" y1="220" y2="230" stroke="#818cf8" stroke-width="1.2"/><circle cx="1040" cy="80" r="3" fill="#38bdf8"/><circle cx="1120" cy="140" r="3" fill="#a855f7"/><circle cx="1100" cy="230" r="3" fill="#f43f5e"/><circle cx="1040" cy="260" r="3" fill="#38bdf8"/><circle cx="970" cy="220" r="3" fill="#818cf8"/><circle cx="960" cy="130" r="3" fill="#00f2fe"/><circle cx="1040" cy="170" r="4" fill="#fff" filter="url(#slightGlow)"/></g><rect width="1197" height="417" x="1.5" y="1.5" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1.2" rx="15"/><line x1="80" x2="350" y1="2" y2="2" stroke="url(#cyanPurpleGrad)" stroke-width="3" filter="url(#slightGlow)"/><line x1="850" x2="1120" y1="2" y2="2" stroke="url(#neonPinkViolet)" stroke-width="3" filter="url(#slightGlow)"/><g transform="translate(600, 52)"><rect width="360" height="28" x="-180" y="0" fill="#1e293b" fill-opacity=".8" stroke="#3b82f6" stroke-width="1" rx="14"/><circle cx="-158" cy="14" r="4.5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="-144" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED 3D &amp; GRAPHICS DIRECTORY</text></g><text x="600" y="132" fill="url(#textGrad)" filter="url(#slightGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5" text-anchor="middle">Awesome 3D Mesh Generation</text><text x="600" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing=".2" text-anchor="middle">WebGL &amp; WebGPU Tutorials &amp; Tools Ecosystem</text><text x="600" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Browser CAD &amp; CSG • LiDAR-to-Three.js • Generative 3D AI • Shaders &amp; Procedural Geometry</text><line x1="360" x2="840" y1="244" y2="244" stroke="#334155" stroke-width="1.2"/><g><g class="pill-anim-1" transform="translate(600, 274) translate(-400, 0)"><rect width="180" height="38" x="0" y="0" fill="#0f172a" fill-opacity=".9" stroke="#0284c7" stroke-width="1.2" rx="19"/><circle cx="20" cy="19" r="6" fill="#38bdf8"/><text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Three.js &amp; R3F</text></g><g class="pill-anim-2" transform="translate(600, 274) translate(-195, 0)"><rect width="180" height="38" x="0" y="0" fill="#0f172a" fill-opacity=".9" stroke="#6366f1" stroke-width="1.2" rx="19"/><circle cx="20" cy="19" r="6" fill="#818cf8"/><text x="3